[project]
name = "vcontainer-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NodyHody06", email = "166039587+NodyHody06@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "orjson>=3.13.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api = "vcontainer_api.main:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "SIM", "W"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.17.0",
]
