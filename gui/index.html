<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>vcontainer</title><link rel="stylesheet" href="/static/style.css"></head><body>
<aside><h1>vcontainer</h1><p>Linux container runtime</p><nav><button onclick="show('containers')">Containers</button><button onclick="show('images')">Images</button></nav><small id="health">Checking backend…</small></aside>
<main><div id="banner" class="error hidden"></div><header><h2 id="title">Containers</h2><div><button onclick="buildImage()">Build from Vcfile</button><div style="display:inline-flex; position:relative;" onmouseleave="$('#run-menu').classList.add('hidden')"><button class="primary" style="border-radius:7px 0 0 7px; margin-right:0;" onclick="runModal()">+ Run container</button><button class="primary" style="border-radius:0 7px 7px 0; margin-left:0; border-left:1px solid #4a57d4; padding:10px 8px;" onclick="$('#run-menu').classList.toggle('hidden')">▼</button><div id="run-menu" class="hidden" style="position:absolute; top:100%; right:0; margin-top:4px; background:#fff; border:1px solid #dfe3ec; border-radius:6px; padding:8px; display:flex; flex-direction:column; gap:4px; box-shadow:0 10px 30px rgba(0,0,30,0.1); z-index:100; white-space:nowrap;"><button style="text-align:left; border:none; margin:0;" onclick="$('#run-menu').classList.add('hidden'); quickRun('blog', '8081:8081')">Run Blog</button><button style="text-align:left; border:none; margin:0;" onclick="$('#run-menu').classList.add('hidden'); quickRun('runner', '8082:8082')">Run Runner</button></div></div></div></header><section id="content">Loading…</section></main>
<dialog id="run"><form onsubmit="runContainer(event)"><h3>Run container</h3><label>Image<select id="image"></select></label><label>Name<input id="name" required></label><label>Command<input id="command" placeholder="optional"></label><label>Memory<input id="memory" placeholder="250M"></label><label>CPUs<input id="cpus" placeholder="50000/100000"></label><label>PIDs<input id="pids" placeholder="64"></label><label>Port<input id="port" placeholder="8081:8081"></label><p><button type="button" onclick="run.close()">Cancel</button><button class="primary">Run</button></p></form></dialog><dialog id="logs"><pre id="logtext"></pre><button onclick="logs.close()">Close</button></dialog><script src="/static/app.js?v=2"></script></body></html>
