name: blogdrop

services:
  database:
    image: mysql
    container_name: blogdrop-db
    mem_limit: 1g
    pids_limit: 256
    cpus: 1.0
    environment:
      MYSQL_ROOT_PASSWORD: change-root-password
      MYSQL_DATABASE: blogdrop_db
      MYSQL_USER: blogdrop
      MYSQL_PASSWORD: change-database-password
    volumes:
      - blogdrop-db:/var/lib/mysql
      - blogdrop-db-init:/docker-entrypoint-initdb.d
    networks:
      default:
        ipv4_address: 10.88.0.30

  backend:
    image: node
    container_name: blogdrop-backend
    mem_limit: 2g
    pids_limit: 128
    cpus: 0.5
    depends_on:
      - database
    environment:
      PORT: "3000"
      DB_HOST: 10.88.0.30
      DB_USER: blogdrop
      DB_PASSWORD: change-database-password
      DB_NAME: blogdrop_db
      SESSION_SECRET: replace-with-a-long-random-secret
    command:
      - /bin/sh
      - -c
      - test -d /app/node_modules || npm --prefix /app ci --omit=dev; exec node /app/server.js
    volumes:
      - blogdrop-backend:/app
    networks:
      default:
        ipv4_address: 10.88.0.31

  frontend:
    image: nginx
    container_name: blogdrop-frontend
    mem_limit: 64m
    pids_limit: 64
    cpus: 0.25
    volumes:
      - blogdrop-frontend:/usr/share/nginx/html
    networks:
      default:
        ipv4_address: 10.88.0.32

  gateway:
    image: nginx
    container_name: blogdrop-nginx
    mem_limit: 64m
    pids_limit: 64
    cpus: 0.25
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - blogdrop-nginx:/etc/nginx/conf.d
    networks:
      default:
        ipv4_address: 10.88.0.33

volumes:
  blogdrop-db:
    name: blogdrop-db
  blogdrop-db-init:
    name: blogdrop-db-init
  blogdrop-backend:
    name: blogdrop-backend
  blogdrop-frontend:
    name: blogdrop-frontend
  blogdrop-nginx:
    name: blogdrop-nginx

networks:
  default:
    ipam:
      config:
        - subnet: 10.88.0.0/24
